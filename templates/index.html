<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Generator</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNCIgZmlsbD0iIzI4YTc0NSIvPgo8dGV4dCB4PSIxNiIgeT0iMjIiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZm9udC13ZWlnaHQ9ImJvbGQiIGZpbGw9IndoaXRlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5NPC90ZXh0Pgo8L3N2Zz4K">
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: darkslategray;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            flex-direction: column;
            overflow: hidden;
        }

        /* Container Styling */
        .container {
            width: 100%;
            max-width: 600px;
            background: whitesmoke;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
            margin-bottom: 150px; /* Spacing between container and footer */
        }

        /* Heading Styling */
        h1 {
            text-align: center;
            color: #333;
            font-weight: 700;
            font-size: 1.6rem;
            margin-bottom: 20px;
        }

        /* Form Group Styling */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #555;
            font-size: 1rem;
        }

        /* Input Styling */
        input[type="file"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            font-size: 1rem;
        }

        /* Custom File Input Styling - Light Gray */
        input[type="file"] {
            background-color: #d3d3d3;
            color: black;
            cursor: pointer;
        }

        input[type="file"]:hover {
            background-color: #b0b0b0;
        }

        /* Button Styling */
        button {
            width: 100%;
            background-color: #28a745;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        /* Footer Styling */
        .footer {
            margin-top: 10px;
            text-align: center;
            font-size: 1.2rem;
            color: white;
            width: 100%;
        }
        .footer a {
            margin: 0 10px;
            color: white;
            font-size: 1.5rem; /* Increase icon size */
            transition: color 0.3s;
        }
        .footer a:hover {
            color: #0073b1; /* Hover color for icons */
        }
        .copyright {
            margin-top: 15px;
            font-size: 1rem;
            color: white;
        }

        /* Loading Animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #28a745;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 1.2rem;
        }
        #loading-time {
            color: white;
            margin-top: 10px;
            font-size: 1rem;
        }

        /* Media Query for Smaller Screens */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.4rem;
            }

            label {
                font-size: 0.9rem;
            }

            input[type="file"],
            input[type="number"] {
                padding: 10px;
                font-size: 0.9rem;
            }

            button {
                padding: 10px;
                font-size: 0.9rem;
            }
        }
    </style>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="container">
        <h1>Generate MCQs from Text</h1>
        <form action="/generate" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Upload your document (PDF, TXT, DOCX):</label>
                <input type="file" name="file" required>
            </div>
            <div class="form-group">
                <label for="num_questions">How many questions? (Max: 10 at once)</label>
                <input type="number" name="num_questions" min="1" max="10" value="5" required>
            </div>
            <button type="submit">Generate MCQs</button>
        </form>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p class="loading-text">Generating MCQs, please wait...</p>
        <p id="loading-time">0s</p>
    </div>

    <!-- Footer Section -->
    <div class="footer">
        <a href="https://www.linkedin.com/in/navyansh/" target="_blank"><i class="fab fa-linkedin"></i></a>
        <a href="https://www.youtube.com/@navygeeks" target="_blank"><i class="fab fa-youtube"></i></a>
        <!--<a href="https://www.instagram.com/navygeeks/" target="_blank"><i class="fab fa-instagram"></i></a>-->
        <a href="https://github.com/navyansh1" target="_blank"><i class="fab fa-github"></i></a>
        <a href="mailto:navycodes@gmail.com"><i class="fas fa-envelope"></i></a>
        <a href="https://navygeeks.in/" target="_blank"><i class="fas fa-globe"></i></a>
        <div class="copyright">&copy; NavyGeeks</div>
    </div>

    <script>
        // Loading animation timer
        let loadingSeconds = 0;
        let loadingTimer;
        
        document.querySelector('form').addEventListener('submit', function() {
            // Show loading overlay
            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.display = 'flex';
            
            // Start timer
            loadingTimer = setInterval(function() {
                loadingSeconds++;
                document.getElementById('loading-time').textContent = loadingSeconds + 's';
            }, 1000);
            
            return true; // Continue with form submission
        });
    </script>
</body>
</html>
